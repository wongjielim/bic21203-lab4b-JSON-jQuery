<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Information</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        background-color: #f5f5f5;
      }

      h1 {
        color: #333;
      }

      .book {
        background-color: white;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 8px;
      }

      #error {
        color: red;
      }
    </style>
  </head>

  <body>
    <h1>Book Information</h1>
    <div id="bookInfo">Loading book information...</div>
    <p id="error"></p>

    <script>
      async function loadBooks() {
        const bookInfo = document.getElementById('bookInfo');
        const errorElement = document.getElementById('error');

        try {
          const response = await fetch("books.json");

          if (!response.ok) {
            throw new Error("Unable to load books.json");
          }

          const data = await response.json();
          const books = data.books;

          if (!Array.isArray(books) || books.length < 2) {
            throw new Error("Invalid book data");
          }

          bookInfo.textContent = "";

          // Display title of the first book
          const firstTitle = document.createElement("p");
          firstTitle.textContent = "First Book Title: " + books[0].title;
          bookInfo.appendChild(firstTitle);

          // Display author of the second book
          const secondAuthor = document.createElement("p");
          secondAuthor.textContent = "Second Book Author: " + books[1].author;
          bookInfo.appendChild(secondAuthor);

          // Display genres of both books
          books.forEach(function(book) {
            const bookDiv = document.createElement("div");
            bookDiv.className = "book";

            const heading = document.createElement("h3");
            heading.textContent = book.title;

            const genres = document.createElement("p");
            genres.textContent = "Genres: " + book.genres.join(", ");

            bookDiv.appendChild(heading);
            bookDiv.appendChild(genres);
            bookInfo.appendChild(bookDiv);
          });
        } catch (error) {
          errorElement.textContent = "Error: Unable to retrieve book information." + error.message;
          bookInfo.textContent = "";
        }
      }

      loadBooks();
    </script>
  </body>
</html>
